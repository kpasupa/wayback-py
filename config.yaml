# Universal Wayback Machine scraper config.
# Run:           python -m wayback run --config config.yaml   (enumerate->download->
#                fetch-external [if external_asset]->clean)
# External only: python -m wayback fetch-external --config config.yaml  (re-run later)

run_dir: "./job01"         # where manifest.json, state.json, raw/ and clean/ live
threads: 4                 # parallel download workers
request_delay: 1.0         # base seconds between requests per worker
max_retries: 10            # max retries per request before marking it failed
snapshot: first            # capture kept per URL: first | last | latest | closest:YYYYMMDD
                           # 'first' uses fast server-side collapse (earliest in range).
                           # last/latest/closest need an uncollapsed scan (slow on big
                           # sites). For "newest" cheaply, narrow `from` to a later year.

# Query params to ignore when keying/naming URLs, so variants that differ only by
# these collapse to one page (e.g. ?v=1.0&method=X == ?method=X).
ignore_query_params:
  - v

# Fetch resources that target pages pull from EXTERNAL domains (CDNs, widgets,
# partner sites): images, CSS, JS, SWF, XML, and <iframe> content. They are fetched
# from Wayback into manifest_external.json and localized under <target>/_external/<host>/.
# Iframes are fetched as a page plus their own direct assets (not link-crawled).
external_asset: true

# Regexes matched against external-resource URLs to SKIP fetching them — useful for
# third-party social widgets that only redirect/break offline (e.g. Facebook plugins).
# Skipped iframes keep their original archive URL (online fallback) instead.
external_exclude: []
#  - 'facebook\.com/(plugins|connect)/'

# Strip page-driven redirects from cleaned HTML (meta-refresh + inline no-JS->JS bounce
# calls like Facebook's), so fetched widget/iframe pages display instead of redirecting.
# Note: a third-party script's own location.href= redirect can't be blocked this way.
kill_redirects: true

google_sheets:             # disabled for now
  enabled: false

targets:
  - name: www              # label for this target — becomes the output subfolder name
    url: "http://www.playfish.com"
    match: prefix          # exact | prefix | host | domain
    from: "20130101"
    to: "20131231"
    html_only: false       # false to also enumerate images, CSS, JS (pair with localize_assets)
    include: []
    exclude: []
    localize_assets: true  # true rewrites img/script/stylesheet src to local paths; needs html_only: false
